<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner{
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;  /*se usar wrap quebra normal*/                
        }

        div.item{
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;             
        }
        
        div#cxA{
            flex-shrink: 0;
            flex-grow:1;
        }

         div#cxB{
            flex-shrink: 1;
            flex-grow: 1;/*nao cresce 4x mas sim o dobro*/
        }

         div#cxC{
            flex-shrink: 3;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">        
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        
       
    </div>


</body>
</html>
