<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner{
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;  /*se usar wrap quebra normal*/                
        }

        div.item{
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px; 
            flex-shrink: 0; /*se usar shrink 1 encolhe*/          
            flex-grow: 0; /*se usar grow 1 aumenta*/ 
        }
    </style>
</head>
<body>
    <div class="conteiner">        
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        
       
    </div>


</body>
</html>
