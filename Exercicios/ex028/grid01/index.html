<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    <style>
        div.conteiner{
            border: 5px solid aqua;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;/*auto=100px*/
            /*grid-template: 100px 100px 100px/auto auto auto;*/
            gap: 5px;
            align-items: normal;/*normal=stretch*/
            justify-items: normal;/*normal=center*/ 
            /*place-items: stretch center;/*subst items*/ 
            /*place-content: start end;/*subst content*/          
            align-content: normal;/*normal=start*/
            justify-content: normal;/*normal=end*/                      
        }
        div.item{
            border: 5px solid rgb(26, 102, 150);
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        
    </div>
    
</body>
</html>
